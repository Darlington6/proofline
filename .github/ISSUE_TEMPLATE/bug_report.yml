name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the route, transaction type, network, and steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, wallet, and commit
    validations:
      required: true
